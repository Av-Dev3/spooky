<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="icon" href="/assets/logo.png" type="image/png">
    <style>
        /* Override some styles for auth page */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .auth-box {
            background: linear-gradient(135deg, var(--surface) 0%, var(--bg) 100%);
            padding: 3rem;
            border-radius: 20px;
            border: 2px solid var(--accent1);
            box-shadow: 0 10px 30px var(--shadow), 0 0 50px var(--glow);
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .auth-logo {
            margin-bottom: 2rem;
        }

        .auth-logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--accent1);
            box-shadow: 0 0 20px var(--glow);
        }

        .auth-title {
            color: var(--accent1);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px var(--glow);
        }

        .auth-subtitle {
            color: #ccc;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent1);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, var(--accent1), var(--glitter1));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        .auth-btn:hover {
            background: linear-gradient(45deg, var(--glitter1), var(--accent1));
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--glow);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-home {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .back-home:hover {
            color: var(--accent1);
        }

        .error-message {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #ff6b6b;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        /* Spooky decorations */
        .bat-decoration {
            position: absolute;
            z-index: 1;
            opacity: 0.6;
        }

        .ghost-decoration {
            position: absolute;
            z-index: 1;
            opacity: 0.6;
        }

        .bat-decoration img,
        .ghost-decoration img {
            width: 40px;
            height: 40px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 2rem;
                margin: 1rem;
            }

            .auth-title {
                font-size: 1.5rem;
            }

            .bat-decoration,
            .ghost-decoration {
                opacity: 0.3;
            }

            .bat-decoration img,
            .ghost-decoration img {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Spooky Decorations -->
    <div class="bat-decoration" style="top: 15%; left: 10%; animation-delay: 0s;">
        <img src="/assets/bat.png" alt="" onerror="this.style.display='none'">
    </div>
    <div class="bat-decoration" style="top: 25%; right: 15%; animation-delay: 2s;">
        <img src="/assets/bat.png" alt="" onerror="this.style.display='none'">
    </div>
    <div class="ghost-decoration" style="top: 70%; left: 8%; animation-delay: 1s;">
        <img src="/assets/ghost.png" alt="" onerror="this.style.display='none'">
    </div>
    <div class="ghost-decoration" style="top: 60%; right: 12%; animation-delay: 3s;">
        <img src="/assets/ghost.png" alt="" onerror="this.style.display='none'">
    </div>
    <div class="bat-decoration" style="top: 80%; left: 20%; animation-delay: 1.5s;">
        <img src="/assets/bat.png" alt="" onerror="this.style.display='none'">
    </div>
    <div class="ghost-decoration" style="top: 35%; right: 25%; animation-delay: 2.5s;">
        <img src="/assets/ghost.png" alt="" onerror="this.style.display='none'">
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <img src="/assets/logo.png" alt="Logo">
            </div>
            
            <h1 class="auth-title">🎭</h1>
            <p class="auth-subtitle">Access Required</p>
            
            <div id="messageContainer"></div>
            
            <form id="authForm">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="auth-btn" id="authBtn">
                    🔐 Access
                </button>
            </form>
            
            <a href="/" class="back-home">← Back</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const authForm = document.getElementById('authForm');
            const passwordInput = document.getElementById('password');
            const authBtn = document.getElementById('authBtn');
            const messageContainer = document.getElementById('messageContainer');
            
            // Check if already logged in
            const cookies = document.cookie.split(';');
            const adminAuth = cookies.find(cookie => cookie.trim().startsWith('admin_auth='));
            if (adminAuth && adminAuth.split('=')[1] === 'ok') {
                // Already logged in, redirect to panel
                window.location.href = '/management/panel.html';
                return;
            }
            
            // Check for error parameter
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error') === '1') {
                showMessage('Invalid password.', 'error');
            }
            
            authForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const password = passwordInput.value.trim();
                if (!password) {
                    showMessage('Please enter password.', 'error');
                    return;
                }
                
                // Disable form during auth
                authBtn.disabled = true;
                authBtn.textContent = '🔄 Verifying...';
                
                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ 
                            password: password,
                            next: getNextUrl()
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        showMessage('Access granted...', 'success');
                        setTimeout(() => {
                            window.location.href = data.redirect || '/management/panel.html';
                        }, 800);
                    } else {
                        showMessage('Access denied.', 'error');
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                } catch (error) {
                    console.error('Auth error:', error);
                    showMessage('Connection error.', 'error');
                } finally {
                    // Re-enable form
                    authBtn.disabled = false;
                    authBtn.textContent = '🔐 Access';
                }
            });
            
            function showMessage(message, type) {
                const messageClass = type === 'error' ? 'error-message' : 'success-message';
                messageContainer.innerHTML = `<div class="${messageClass}">${message}</div>`;
                
                // Auto-hide success messages
                if (type === 'success') {
                    setTimeout(() => {
                        messageContainer.innerHTML = '';
                    }, 2000);
                }
            }
            
            function getNextUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('next') || '/management/panel.html';
            }
            
            // Focus password input on load
            passwordInput.focus();
        });
    </script>
</body>
</html>
